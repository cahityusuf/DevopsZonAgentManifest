apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: clone-build-push
spec:
  description: | 
    This pipeline clones a git repo, then echoes the README file to the stout.
  params:
  - name: repo_url
    type: string
    description: The git repo URL to clone from.
  - name: dockerfile_path
    type: string
  - name: dockerfile_context
    type: string
  - name: image_tag
    type: string
  - name: image_name
    type: string
  - name: manifest_repo
    type: string
  - name: manifest_path
    type: string
  - name: application_name
    type: string
  - name: apisix_url
    type: string      
  - name: apisix_admin_api_key
    type: string
  - name: apisix_upstream_name
    type: string
  - name: apisix_service_name
    type: string
  - name: apisix_route_name
    type: string
  - name: apisix_route_host
    type: string
  - name: backend_svc_name
    type: string
  - name: backend_svc_port
    type: string
  - name: git_username
    type: string
  - name: git_email
    type: string
  - name: branch_name
    type: string
  - name: resources_request_memory
    type: string
    default: "256Mi"
  - name: resources_request_cpu
    type: string
    default: "100m"
  - name: resources_limit_memory
    type: string
    default: "512Mi"
  - name: resources_limit_cpu
    type: string
    default: "500m"
  - name: min_replicas
    type: string
    default: "1"
  - name: max_replicas
    type: string
    default: "5" 
  - name: cpu_average_utilization
    type: string
    default: "70"
  - name: memory_average_utilization
    type: string
    default: "70"
  - name: container_port
    type: string
    default: "80"
  - name: vault_token
    type: string
    default: ""
  - name: devopszon_agent_url
    type: string
    default: "http://devopszon-agent-service/api/manifest/update-image"
  - name: configuration_items_json
    type: string
    default: "[]"
    description: "JSON string for configuration items"
  workspaces:
  - name: shared-data
    description: | 
      This workspace contains the cloned repo files, so they can be read by the
      next task.
  - name: docker-credentials
    description: My docker credentials
  - name: basic-auth
    description: Basic auth credentials for Git
  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    - name: basic-auth
      workspace: basic-auth
    params:
    - name: url
      value: $(params.repo_url)
    - name: revision
      value: $(params.branch_name)
  - name: build-push
    runAfter: ["fetch-source"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    - name: dockerconfig
      workspace: docker-credentials
    params:
    - name: IMAGE
      value: $(params.image_name):$(params.image_tag)
    - name: DOCKERFILE
      value: $(params.dockerfile_path)
    - name: CONTEXT
      value: $(params.dockerfile_context)
  - name: update-manifest
    taskRef:
      name: devopszon-agent-update
    runAfter:
      - build-push
    params:
      - name: image_name
        value: $(params.image_name)
      - name: image_tag
        value: $(params.image_tag)
      - name: manifest_repo
        value: $(params.manifest_repo)
      - name: manifest_path
        value: $(params.manifest_path)
      - name: application_name
        value: $(params.application_name)
      - name: namespace
        value: $(params.namespace)
      - name: deployment_name
        value: $(params.deployment_name)
      - name: deployment_label
        value: $(params.deployment_label)
      - name: image_registry
        value: $(params.image_registry)
      - name: image_path
        value: $(params.image_path)
      - name: container_port
        value: $(params.container_port)
      - name: resources_request_memory
        value: $(params.resources_request_memory)
      - name: resources_request_cpu
        value: $(params.resources_request_cpu)
      - name: resources_limit_memory
        value: $(params.resources_limit_memory)
      - name: resources_limit_cpu
        value: $(params.resources_limit_cpu)
      - name: min_replicas
        value: $(params.min_replicas)
      - name: max_replicas
        value: $(params.max_replicas)
      - name: cpu_average_utilization
        value: $(params.cpu_average_utilization)
      - name: memory_average_utilization
        value: $(params.memory_average_utilization)
      - name: vault_token
        value: $(params.vault_token)
      - name: devopszon_agent_url
        value: $(params.devopszon_agent_url)
      - name: configuration_items_json
        value: $(params.configuration_items_json)
  - name: sync-argocd-app
    runAfter: ["update-manifest"]
    taskRef:
      name: argocd-task-sync-and-wait
    params:
      - name: application-name
        value: $(params.application_name)
      - name: flags
        value: --insecure
      - name: argocd-version
        value: v2.1.7
  - name: create-apisix-route
    runAfter: ["sync-argocd-app"]
    taskRef:
      name: create-apisix-route
    params:
    - name: apisix_url
      value: "http://$(params.apisix_url)"
    - name: apisix_admin_api_key
      value: $(params.apisix_admin_api_key)
    - name: apisix_upstream_name
      value: $(params.apisix_upstream_name)
    - name: apisix_service_name
      value: $(params.apisix_service_name)
    - name: apisix_route_name
      value: $(params.apisix_route_name)
    - name: apisix_route_host
      value: "$(params.apisix_route_host)"
    - name: backend_svc_name
      value: $(params.backend_svc_name)
    - name: backend_svc_port
      value: $(params.backend_svc_port)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: template
spec:
  params:
  - name: image_tag
    default: "v1"
  - name: application_name
    default: "v1"
    description: "ArgoCd Application Name"
  - name: repo_url
    default: "url"
  - name: image_name
    default: "image_name"
  - name: dockerfile_path
    default: "dockerfile_path"
    description: "s"
  - name: dockerfile_context
    default: "dockerfile_context"
  - name: manifest_repo
    default: "manifest_repo"
    description: "manifest_repo"
  - name: manifest_path
    default: "manifest_path"
    description: "manifest_path"
  - name: git_username
    default: "example"
    description: "exaple"
  - name: git_email
    default: "example@gmail.com"
    description: "example@gmail.com"
  - name: branch_name
    default: "main"
    description: "main"
  - name: apisix_url
    default: "apisix_url"
    description: "apisix_url"
  - name: apisix_admin_api_key
    default: "apisix_admin_api_key"
    description: "apisix_admin_api_key"
  - name: apisix_upstream_name
    default: "apisix_upstream_name"
    description: "apisix_upstream_name"
  - name: apisix_service_name
    default: "apisix_service_name"
    description: "apisix_service_name"
  - name: apisix_route_name
    default: "apisix_route_name"
    description: "apisix_route_name"
  - name: apisix_route_host
    default: "apisix_route_host"
    description: "apisix_route_host"
  - name: backend_svc_name
    default: "backend_svc_name"
    description: "backend_svc_name"
  - name: backend_svc_port
    default: "backend_svc_port"
    description: "backend_svc_port"
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: PipelineRun
    metadata:
      generateName: trigger-  # generateName kullanılıyor
    spec:
      pipelineRef:
        name: clone-build-push
      podTemplate:
        securityContext:
          fsGroup: 65532
      workspaces:
      - name: shared-data
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      - name: basic-auth
        secret:
          secretName: basic-auth-secret
      - name: docker-credentials
        secret:
          secretName: docker-credentials
      params:
      - name: image_tag
        value: $(tt.params.image_tag)
      - name: repo_url
        value: $(tt.params.repo_url)
      - name: image_name
        value: $(tt.params.image_name)
      - name: dockerfile_path
        value: $(tt.params.dockerfile_path)
      - name: dockerfile_context
        value: $(tt.params.dockerfile_context)
      - name: application_name
        value: $(tt.params.application_name)
      - name: manifest_repo
        value: $(tt.params.manifest_repo)
      - name: manifest_path
        value: $(tt.params.manifest_path)
      - name: git_username
        value: $(tt.params.git_username)
      - name: git_email
        value: $(tt.params.git_email)
      - name: branch_name
        value: $(tt.params.branch_name)
      - name: apisix_url
        value: $(tt.params.apisix_url)
      - name: apisix_admin_api_key
        value: $(tt.params.apisix_admin_api_key)
      - name: apisix_upstream_name
        value: $(tt.params.apisix_upstream_name)
      - name: apisix_service_name
        value: $(tt.params.apisix_service_name)
      - name: apisix_route_name
        value: $(tt.params.apisix_route_name)
      - name: apisix_route_host
        value: $(tt.params.apisix_route_host)
      - name: backend_svc_name
        value: $(tt.params.backend_svc_name)
      - name: backend_svc_port
        value: $(tt.params.backend_svc_port)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: binding
spec: 
  params:
    - name: image_tag
      value: $(body.data.image_tag)
    - name: repo_url
      value: $(body.data.repo_url)
    - name: image_name
      value: $(body.data.image_name)
    - name: dockerfile_path
      value: $(body.data.dockerfile_path)
    - name: dockerfile_context
      value: $(body.data.dockerfile_context)
    - name: application_name
      value: $(body.data.application_name)
    - name: manifest_repo
      value: $(body.data.manifest_repo)
    - name: manifest_path
      value: $(body.data.manifest_path)
    - name: git_email
      value: $(body.data.git_email)
    - name: git_username
      value: $(body.data.git_username)
    - name: branch_name
      value: $(body.data.branch_name)
    - name: apisix_url
      value: $(body.data.apisix.url)
    - name: apisix_admin_api_key
      value: $(body.data.apisix.admin_api_key)
    - name: apisix_upstream_name
      value: $(body.data.apisix.upstream_name)
    - name: apisix_service_name
      value: $(body.data.apisix.service_name)
    - name: apisix_route_name
      value: $(body.data.apisix.route_name)
    - name: apisix_route_host
      value: $(body.data.apisix.route_host)
    - name: backend_svc_name
      value: $(body.data.apisix.backend_svc_name)
    - name: backend_svc_port
      value: $(body.data.apisix.backend_svc_port)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: listener
spec:
  serviceAccountName: tekton-robot
  triggers:
    - name: trigger 
      bindings:
      - ref: binding
      template:
        ref: template